name: Validate monorepo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:api
      - run: npm run build:web
        env:
          PUBLIC_API_BASE_URL: https://little-by-little-api.aggre-progress.workers.dev
          PUBLIC_SITE_URL: https://aggre.github.io
          PUBLIC_BASE_PATH: /progress/
