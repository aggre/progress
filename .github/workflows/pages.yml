name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/shared/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://little-by-little-api.aggre-progress.workers.dev' }}
  PUBLIC_SITE_URL: https://aggre.github.io
  PUBLIC_BASE_PATH: /progress/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Require the production API URL
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.PUBLIC_API_BASE_URL;
          if (!value) {
            console.error('::error::Configure a production PUBLIC_API_BASE_URL before deploying.');
            process.exit(1);
          }
          try {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password ||
                url.search || url.hash || url.pathname !== '/' ||
                ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) {
              throw new Error('A production HTTPS API origin is required.');
            }
          } catch {
            console.error('::error::PUBLIC_API_BASE_URL must be a production HTTPS API origin.');
            process.exit(1);
          }
          NODE
      - name: Install workspace dependencies
        run: npm ci
      - name: Build the static frontend
        run: npm run build:web
      - name: Verify the Pages artifact
        run: |
          node --input-type=module <<'NODE'
          import { access, readdir } from 'node:fs/promises';
          await access('apps/web/dist/index.html');
          async function inspect(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = `${directory}/${entry.name}`;
              if (entry.isDirectory()) await inspect(path);
              else if (entry.name === '_worker.js' || /\.zip$/i.test(entry.name)) {
                throw new Error(`Server bundles and source archives must not be published: ${path}`);
              }
            }
          }
          await inspect('apps/web/dist');
          NODE
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
